spring.application.name=demo
server.servlet.context-path=/demo

# Owners classified as CLE during the owner-detection step (comma separated, case-insensitive).
# Owners prefixed with "CLE-" / "CLE_" are also treated as CLE; everything else is NON-CLE.
retirement.cle.owners=CLE,CLE-TEAM

# Customer portal login link embedded in the maturity package welcome email.
retirement.portal.login-url=http://localhost:5173/?tab=portal

# --- Demo data -----
# Seeds the three prototype scenarios (broker happy path, missing information,
# ownership exception) on start-up when the policy store is empty.
retirement.demo.seed.enabled=true

# --- Efficiency measures -----
# Assumed manual touchpoints per maturity in the current mailshot-driven process.
# This is a stated assumption used for comparison, not a measured figure.
retirement.efficiency.baseline-manual-touchpoints-per-case=9

# --- Spring Batch ---
# Do not auto-run jobs on startup; the scheduler owns the trigger.
spring.batch.job.enabled=false
# Create the batch metadata tables in the embedded H2 JobRepository.
spring.batch.jdbc.initialize-schema=always

# Embedded datasource used only by the Spring Batch JobRepository.LOL
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Retirement journey scheduled job -----
retirement.batch.scheduler.enabled=true
# Every 2 minutes, measured from the end of the previous run.
retirement.batch.scheduler.fixed-delay-ms=120000
retirement.batch.scheduler.initial-delay-ms=10000

# --- Spring AI (OpenAI) ---------------------------------------------------
# AI is OPT-IN so the app still boots with no API key.
# Enable with:  $env:SPRING_AI_CHAT="openai"; $env:OPENAI_API_KEY="sk-..."
spring.ai.model.chat=${SPRING_AI_CHAT:none}

# Spring AI auto-configures EVERY OpenAI model type by default, and each one
# asserts that an API key is present. We only use chat, so the rest are off -
# otherwise startup fails with "OpenAI API key must be set" from, for example,
# OpenAiAudioSpeechAutoConfiguration.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# NEVER hard-code the key here - this file is committed to git.
# Supply it via the OPENAI_API_KEY environment variable or an untracked
# application-local.properties (see AI_SETUP.md).
spring.ai.openai.api-key=${OPENAI_API_KEY:PUT_YOUR_OPEN_API_KEY_HERE}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

# When no ChatModel bean is present the service falls back to deterministic
# rule-based insights, so the API contract never breaks.
retirement.ai.enabled=true