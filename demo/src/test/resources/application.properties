spring.application.name=demo

# No context-path in tests so MockMvc paths stay simple.

retirement.cle.owners=CLE,CLE-TEAM

# Tests assert against empty repositories, so the demo scenarios must not seed.
retirement.demo.seed.enabled=false

# --- Spring Batch ---
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

spring.datasource.url=jdbc:h2:mem:batchdb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The scheduler must not fire during tests - it would advance case statuses
# underneath the integration assertions. Tests launch the job explicitly.
retirement.batch.scheduler.enabled=false

# --- Spring AI ---
# No live LLM calls in tests: every OpenAI model type is switched off so no
# API key is required and the retirement service uses its deterministic
# fallback, keeping assertions stable.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
retirement.ai.enabled=false